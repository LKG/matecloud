apiVersion: apps/v1
kind: Deployment
metadata:
  name: mate-gateway
  namespace: matecloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mate-gateway
  template:
    metadata:
      labels:
        app: mate-gateway
    spec:
      containers:
        - name: mate-gateway
          image: matecloud/mate-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9010
          envFrom:
            - configMapRef:
                name: matecloud-config
            - secretRef:
                name: matecloud-secret
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9010
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9010
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mate-gateway
  namespace: matecloud
spec:
  type: ClusterIP
  selector:
    app: mate-gateway
  ports:
    - port: 9010
      targetPort: 9010
      protocol: TCP
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mate-gateway
  namespace: matecloud
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: api.matecloud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mate-gateway
                port:
                  number: 9010
