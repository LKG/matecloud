# ============================================================
# MateCloud Infrastructure Config  (dev profile)
# ============================================================
# DataId:    mate-infra-dev.yml
# Group:     DEFAULT_GROUP
# Upload:    java -jar mate-cli.jar config init
#
# THIS IS THE ONLY SHARED CONFIG EVERY MATECLOUD SERVICE READS.
# It holds env-specific settings (DB/Redis/MQ credentials, etc).
# Framework-constant settings live in classpath mate-defaults.yml.
#
# IMPORTANT: Do NOT use YAML multi-document separator (---).
# Nacos does not support multi-document YAML.
# ============================================================

# ---- MySQL / Druid ----
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:matecloud}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:matecloud123}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: stat,wall,slf4j

  # ---- Redis / Lettuce ----
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:matecloud123}
      database: ${REDIS_DB:0}
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000

  # ---- RabbitMQ ----
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:matecloud}
    password: ${RABBITMQ_PASS:matecloud123}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

  # ---- Sentinel (disabled by default in dev) ----
  cloud:
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
    # ---- Gateway CORS(仅 mate-gateway 读取;其它服务无此 classpath,忽略)----
    # 部署地址(如 http://<服务器IP>:8888)需在 CORS 白名单内,否则浏览器
    # 带 Origin 的 POST 会被网关 CORS 拒成 403(GET 同源不带 Origin 不受影响)。
    # 用 allowed-origin-patterns="*" 放行任意来源(配合 allow-credentials 由 Spring 回显 Origin)。
    # 改完重推配置 + 重启 mate-gateway 即生效,无需重建镜像。
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

# ---- Dubbo ----
# Dubbo registry/metadata-report address is fully configured in mate-defaults.yml.
# Do NOT define dubbo.registry.address here — it would override the
# use-as-config-center=false and namespace URL parameters in mate-defaults.yml.
#
# These two registry properties are safe to override here (they don't touch
# address) and take effect WITHOUT rebuilding the service images:
dubbo:
  registry:
    # all = 同时做应用级(instance) + 接口级(interface) 注册。
    # 默认 instance 模式下,消费者的接口级订阅解析不到应用级 provider → RPC 空 →
    # 登录拿不到角色/权限 → 前端 403。all 模式下接口级订阅可直接命中。
    register-mode: all
    # 空地址保护:provider 重启或消费者先启动时,注册中心瞬时推空地址不清空已缓存地址。
    enable-empty-protection: true

# ---- MinIO ----
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:matecloud}
  secret-key: ${MINIO_SECRET_KEY:matecloud123}
  bucket-name: ${MINIO_BUCKET:matecloud}

# ---- XXL-Job ----
xxl:
  job:
    admin-addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8080/xxl-job-admin}
    access-token: ${XXL_JOB_TOKEN:matecloud-xxljob-token}
    app-name: ${spring.application.name}
    port: 9999
    log-path: ./logs/xxl-job
    log-retention-days: 30

# ---- Sa-Token ----
sa-token:
  # dev 放宽活跃超时: 框架默认 1800s, 改前端/写代码超过 30 分钟无请求 token 即被冻结,
  # 回来第一个请求 401 → 被迫重新登录。-1 = 永不冻结 (绝对有效期 timeout: 86400 仍然生效)。
  active-timeout: -1
  alone-redis:
    host: ${SA_TOKEN_REDIS_HOST:${REDIS_HOST:127.0.0.1}}
    port: ${SA_TOKEN_REDIS_PORT:${REDIS_PORT:6379}}
    password: ${SA_TOKEN_REDIS_PASSWORD:${REDIS_PASSWORD:matecloud123}}
    database: ${SA_TOKEN_REDIS_DB:1}
    timeout: 5000

# ---- Logging ----
logging:
  level:
    root: INFO
    vip.mate: DEBUG
    com.baomidou.mybatisplus: INFO
    com.alibaba.druid: WARN
    org.springframework.web: INFO
