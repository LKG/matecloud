server:
  port: 8080

spring:
  application:
    name: mate-monolith
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - classpath:mate-defaults.yml
      - optional:nacos:mate-infra-${spring.profiles.active:dev}.yml
      - optional:nacos:${spring.application.name}-${spring.profiles.active:dev}.yml

# Force local mode — Dubbo is disabled, ports are wired in-process.
mate:
  rpc:
    mode: local

# CORS for the admin UI when running standalone.
mate-cors:
  allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  allowed-headers: "*"
  allowed-methods: "*"

logging:
  level:
    vip.mate: info
    org.apache.dubbo: warn
