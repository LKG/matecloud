          - { code: crm.invoice.issue, name: 开票, perms: crm:invoice:issue, type: F, sort: 2 }
          - { code: crm.invoice.void, name: 作废, perms: crm:invoice:void, type: F, sort: 3 }
      # ---- 售后 ----
      - code: crm.aftersale
        name: 售后工单
        nameEn: After-sales
        path: /crm/aftersales
        component: crm/AfterSaleList
        perms: crm:aftersale:list
        type: C
        icon: LifeBuoy
        sort: 11
        children:
          - { code: crm.aftersale.add, name: 工单创建, perms: crm:aftersale:add, type: F, sort: 1 }
          - { code: crm.aftersale.handle, name: 工单处理, perms: crm:aftersale:handle, type: F, sort: 2 }
          - { code: crm.aftersale.close, name: 工单关闭, perms: crm:aftersale:close, type: F, sort: 3 }
      # ---- 审批中心 ----
      - code: crm.approval
        name: 审批中心
        nameEn: Approvals
        path: /crm/approvals
        component: crm/ApprovalCenter
        perms: crm:approval:list
        type: C
        icon: CheckSquare
        sort: 12
        children:
          - { code: crm.approval.audit, name: 审批操作, perms: crm:approval:audit, type: F, sort: 1 }
      # ---- 公海规则配置 ----
      - code: crm.pool.config
        name: 公海规则
        nameEn: Pool Rules
        path: /crm/pool-config
        component: crm/PoolConfig
        perms: crm:pool:config
        type: C
        icon: RefreshCw
        sort: 13
        children:
          - { code: crm.pool.config.edit, name: 规则修改, perms: crm:pool:config:edit, type: F, sort: 1 }
      # ---- 我的待办 ----
      - code: crm.task
        name: 我的待办
        nameEn: My Tasks
        path: /crm/tasks
        component: crm/TaskList
        perms: crm:task:list
