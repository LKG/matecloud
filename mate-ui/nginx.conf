server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 上传体上限: 默认 1MB 会让合同/素材 docx(数 MB)报 413。对齐后端
    # spring.servlet.multipart.max-request-size=60MB (见 mate-defaults.yml)。
    client_max_body_size 60m;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA history-mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must NOT be cached — it references hash-named assets, so a stale
    # cached copy (esp. Safari) keeps loading old JS/CSS after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Long-cache hashed assets (filename hash changes on rebuild → safe to cache)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API → mate-gateway (keeps the /api/v1/... prefix; matches client baseURL)
    location /api/ {
        # Use Docker's embedded DNS and a *variable* upstream so nginx re-resolves
        # mate-gateway at request time. With a hard-coded hostname in proxy_pass,
        # nginx caches the IP at startup; rebuilding mate-gateway gives it a new
        # container IP and nginx keeps hitting the dead old one → 502 Bad Gateway.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mate_gateway mate-gateway;
        proxy_pass http://$mate_gateway:9010;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / streaming (e.g. /api/v1/ai/chat/stream)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
